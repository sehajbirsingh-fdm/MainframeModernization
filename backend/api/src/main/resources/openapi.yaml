openapi: 3.0.3
info:
  title: Bank of Z Modernization API
  version: 1.0.0
  description: Spring Boot API that modernizes approved Bank of Z legacy inquiry and onboarding capabilities using local mocked data.
paths:
  /api/v1/customers/{sortCode}/{customerNumber}:
    get:
      summary: Retrieve customer inquiry response
      operationId: getCustomerInquiry
      parameters:
        - name: sortCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{6}$'
            example: '123456'
        - name: customerNumber
          in: path
          required: true
          description: Use 0000000000 for random lookup and 9999999999 for latest lookup.
          schema:
            type: string
            pattern: '^[0-9]{10}$'
            example: '0000000001'
      responses:
        '200':
          description: Customer inquiry completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerInquiryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found or special lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerInquiryResponse'
        '500':
          description: System error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/customers/{customerNumber}/accounts:
    get:
      summary: Retrieve customer-account relationship inquiry response
      operationId: getCustomerAccountRelationship
      parameters:
        - name: customerNumber
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{10}$'
            example: '0000000001'
      responses:
        '200':
          description: Customer-account inquiry completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccountInquiryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureErrorResponse'
  /api/v1/accounts/{sortCode}/{accountNumber}/transactions:
    get:
      summary: Retrieve an account transaction inquiry page
      operationId: getAccountTransactions
      parameters:
        - name: sortCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{6}$'
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{8}$'
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{8}$'
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{8}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Successful inquiry page including empty success outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InqtranTransactionListResponse'
        '400':
          description: Request violates structural or boundary validation rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InqtranErrorResponse'
        '500':
          description: Repository or retrieval technical failure with no partial success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InqtranErrorResponse'
  /api/v1/customers/{customerNumber}:
    put:
      summary: Update customer details (UPDCUST parity)
      operationId: updateCustomer
      parameters:
        - name: customerNumber
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{1,10}$'
            example: '1'
        - name: sortCode
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{6}$'
            example: '123456'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerErrorResponse'
        '422':
          description: Legacy business-rule failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerErrorResponse'
        '500':
          description: Internal update/read failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerErrorResponse'
components:
  schemas:
    CustomerInquiryResponse:
      type: object
      required: [legacyStatus, lookupMode]
      properties:
        legacyStatus:
          $ref: '#/components/schemas/LegacyInquiryStatus'
        lookupMode:
          type: string
          enum: [SPECIFIC, RANDOM, LATEST]
        customer:
          $ref: '#/components/schemas/CustomerResponse'
          nullable: true
        riskAssessment:
          $ref: '#/components/schemas/RiskAssessmentResponse'
          nullable: true
    LegacyInquiryStatus:
      type: object
      required: [inquirySuccess, inquiryFailCode, message]
      properties:
        inquirySuccess:
          type: string
          enum: [Y, N]
        inquiryFailCode:
          type: string
          enum: ['0', '1', '2', '9']
        message:
          type: string
    CustomerResponse:
      type: object
      properties:
        eyecatcher:
          type: string
          maxLength: 4
        sortCode:
          type: string
          pattern: '^[0-9]{6}$'
        customerNumber:
          type: string
          pattern: '^[0-9]{10}$'
        title:
          type: string
          maxLength: 10
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
          maxLength: 20
        address:
          $ref: '#/components/schemas/AddressResponse'
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        createdDate:
          type: string
          format: date
        creditScore:
          type: integer
          minimum: 0
          maximum: 999
        creditScoreReviewDate:
          type: string
          format: date
    AddressResponse:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        postcode:
          type: string
        country:
          type: string
    RiskAssessmentResponse:
      type: object
      properties:
        riskRating:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        reviewRequired:
          type: boolean
        reasons:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorResponse'
    FieldErrorResponse:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    CustomerAccountInquiryResponse:
      type: object
      required: [legacyStatus, customerNumber, numberOfAccounts, accounts]
      properties:
        legacyStatus:
          $ref: '#/components/schemas/InqacccuLegacyStatus'
        customerNumber:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^[0-9]{10}$'
        numberOfAccounts:
          type: integer
          minimum: 0
          maximum: 20
        accounts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/InqacccuAccountSummary'
    InqacccuLegacyStatus:
      type: object
      required: [success, failCode, customerFound]
      properties:
        success:
          type: string
          enum: [Y, N]
        failCode:
          type: string
        customerFound:
          type: string
          enum: [Y, N]
    InqacccuAccountSummary:
      type: object
      required:
        - eyecatcher
        - customerNumber
        - accountNumber
        - sortCode
        - accountType
        - interestRate
        - openedDate
        - overdraftLimit
        - lastStatementDate
        - nextStatementDate
        - availableBalance
        - actualBalance
      properties:
        eyecatcher:
          type: string
        customerNumber:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^[0-9]{10}$'
        accountNumber:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[0-9]{8}$'
        sortCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
        accountType:
          type: string
        interestRate:
          type: number
        openedDate:
          type: string
          format: date
        overdraftLimit:
          type: number
          format: double
        lastStatementDate:
          type: string
          format: date
        nextStatementDate:
          type: string
          format: date
        availableBalance:
          type: number
          format: double
        actualBalance:
          type: number
          format: double
    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ValidationErrorPayload'
    ValidationErrorPayload:
      type: object
      required: [type, message, details]
      properties:
        type:
          type: string
          enum: [VALIDATION_ERROR]
        message:
          type: string
          enum: [Validation failed]
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
    ValidationErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    InfrastructureErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/InfrastructureError'
    InfrastructureError:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [INFRASTRUCTURE_ERROR]
        message:
          type: string
          enum: [Service unavailable due to infrastructure failure]
    InqtranTransactionListResponse:
      type: object
      required: [sortCode, accountNumber, limit, offset, totalCount, returnedCount, transactions]
      properties:
        sortCode:
          type: string
          pattern: '^[0-9]{6}$'
        accountNumber:
          type: string
          pattern: '^[0-9]{8}$'
        fromDate:
          type: string
          nullable: true
          pattern: '^[0-9]{8}$'
        toDate:
          type: string
          nullable: true
          pattern: '^[0-9]{8}$'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        returnedCount:
          type: integer
          minimum: 0
          maximum: 100
        transactions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/InqtranTransaction'
    InqtranTransaction:
      type: object
      required: [transactionId, sortCode, accountNumber, date, time, reference, type, description, amount]
      properties:
        transactionId:
          type: string
          maxLength: 50
        sortCode:
          type: string
          pattern: '^[0-9]{6}$'
        accountNumber:
          type: string
          pattern: '^[0-9]{8}$'
        date:
          type: string
          pattern: '^[0-9]{8}$'
        time:
          type: string
          pattern: '^[0-9]{6}$'
        reference:
          type: string
          maxLength: 12
        type:
          type: string
          maxLength: 3
        description:
          type: string
          maxLength: 40
        amount:
          type: number
          format: double
          multipleOf: 0.01
    InqtranErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          nullable: true
    UpdateCustomerRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 10
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        dateOfBirth:
          type: string
          pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        phoneNumber:
          type: string
          maxLength: 20
        address:
          $ref: '#/components/schemas/UpdateCustomerAddress'
        customerStatus:
          type: string
          maxLength: 10
    UpdateCustomerAddress:
      type: object
      properties:
        addressLine1:
          type: string
          maxLength: 50
        addressLine2:
          type: string
          maxLength: 50
        city:
          type: string
          maxLength: 50
        postalCode:
          type: string
          maxLength: 10
        country:
          type: string
          maxLength: 50
    UpdateCustomerResponse:
      type: object
      required: [customerNumber, sortCode, legacyStatus]
      properties:
        customerNumber:
          type: string
          pattern: '^[0-9]{10}$'
        sortCode:
          type: string
          pattern: '^[0-9]{6}$'
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        phoneNumber:
          type: string
        address:
          $ref: '#/components/schemas/UpdateCustomerAddress'
        customerStatus:
          type: string
        createdDate:
          type: string
          format: date
          nullable: true
        creditScore:
          type: integer
          nullable: true
        creditScoreReviewDate:
          type: string
          format: date
          nullable: true
        legacyStatus:
          $ref: '#/components/schemas/LegacyUpdateStatus'
    LegacyUpdateStatus:
      type: object
      required: [updSuccess, updFailCode]
      properties:
        updSuccess:
          type: string
          enum: [Y, N]
        updFailCode:
          type: string
    UpdateCustomerErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId, timestamp]
          properties:
            code:
              type: string
            message:
              type: string
            legacyFailCode:
              type: string
            correlationId:
              type: string
            timestamp:
              type: string
