spring.application.name=inqcust-api
app.lookup.random-retry-limit=1000

# H2 database configuration (default local runtime).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mainframe-modernization;MODE=DB2;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Initialize schema and seed data on startup for local runs.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Optional H2 console for local diagnostics.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.inqacc.db.schema=${APP_INQACC_DB_SCHEMA:}
app.inqacc.db.table-name=ACCOUNT
app.inqtran.db.schema=${APP_INQTRAN_DB_SCHEMA:}
app.inqtran.db.table-name=PROCTRAN
app.inqstmt.db.schema=${APP_INQSTMT_DB_SCHEMA:}
app.inqstmt.account.table-name=ACCOUNT
app.inqstmt.transaction.table-name=PROCTRAN

# CORS settings for frontend applications calling this API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Shared table settings.
app.db.table-name=CUSTOMER

app.inqacccu.db.schema=${APP_INQACCCU_DB_SCHEMA:}
app.inqacccu.simulation-table=RELATIONSHIP_SIMULATION

# Operational visibility for production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
