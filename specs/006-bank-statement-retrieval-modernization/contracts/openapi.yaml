openapi: 3.0.3
info:
  title: Bank Statement Retrieval API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/v1/accounts/{sortCode}/{accountNumber}/statements/{period}:
    get:
      operationId: getAccountStatement
      summary: Retrieve account statement for a period
      security:
        - bearerAuth: []
      parameters:
        - name: sortCode
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{6}$' }
        - name: accountNumber
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{8}$' }
        - name: period
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{4}(0[1-9]|1[0-2])$' }
          description: Statement period in YYYYMM.
      responses:
        '200':
          description: Statement retrieved successfully.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStatementResponse' }
        '400':
          description: Structural validation failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Authenticated but unauthorized request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Account or statement context not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Technical retrieval failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountStatementResponse:
      type: object
      required: [sortCode, accountNumber, period, summary, entries]
      properties:
        sortCode: { type: string, pattern: '^[0-9]{6}$' }
        accountNumber: { type: string, pattern: '^[0-9]{8}$' }
        period: { type: string, pattern: '^[0-9]{4}(0[1-9]|1[0-2])$' }
        summary:
          type: object
          required: [periodFrom, periodTo, openingBalance, totalCredits, totalDebits, closingBalance, transactionCount]
          properties:
            periodFrom: { type: string, pattern: '^[0-9]{8}$' }
            periodTo: { type: string, pattern: '^[0-9]{8}$' }
            openingBalance: { type: number, format: double }
            totalCredits: { type: number, format: double }
            totalDebits: { type: number, format: double }
            closingBalance: { type: number, format: double }
            transactionCount: { type: integer, minimum: 0 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/StatementEntry' }
    StatementEntry:
      type: object
      required: [date, time, reference, type, description, amount]
      properties:
        date: { type: string, pattern: '^[0-9]{8}$' }
        time: { type: string, pattern: '^[0-9]{6}$' }
        reference: { type: string, pattern: '^[0-9]{12}$' }
        type: { type: string, maxLength: 3 }
        description: { type: string, maxLength: 40 }
        amount: { type: number, format: double }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
