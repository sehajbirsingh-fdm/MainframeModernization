openapi: 3.0.3
info:
  title: INQTRANL Transaction List Inquiry API
  version: 1.0.0
  description: Evidence-backed modernization contract for the INQTRANL list operation.
paths:
  /api/v1/accounts/{sortCode}/{accountNumber}/transactions:
    get:
      operationId: getAccountTransactions
      summary: Retrieve an account transaction list
      parameters:
        - name: sortCode
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{6}$' }
        - name: accountNumber
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{8}$' }
        - name: fromDate
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{8}$' }
        - name: toDate
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{8}$' }
        - name: limit
          in: query
          required: false
          description: Omitted or zero defaults to 50; values above 100 are processed as 100.
          schema: { type: integer, minimum: 0, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 99999, default: 0 }
      responses:
        '200':
          description: Successful page, including an empty page when no rows match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionListResponse' }
        '400':
          description: Request violates approved boundary validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Technical retrieval failure; no partial page is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  schemas:
    TransactionListResponse:
      type: object
      required: [sortCode, accountNumber, limit, offset, totalCount, returnedCount, transactions]
      properties:
        sortCode: { type: string, pattern: '^[0-9]{6}$' }
        accountNumber: { type: string, pattern: '^[0-9]{8}$' }
        fromDate: { type: string, nullable: true, pattern: '^[0-9]{8}$' }
        toDate: { type: string, nullable: true, pattern: '^[0-9]{8}$' }
        limit: { type: integer, minimum: 0, maximum: 100 }
        offset: { type: integer, minimum: 0, maximum: 99999 }
        totalCount: { type: integer, minimum: 0 }
        returnedCount: { type: integer, minimum: 0, maximum: 100 }
        transactions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Transaction' }
    Transaction:
      type: object
      required: [transactionId, sortCode, accountNumber, date, time, reference, type, description, amount]
      properties:
        transactionId: { type: string, maxLength: 50 }
        sortCode: { type: string, pattern: '^[0-9]{6}$' }
        accountNumber: { type: string, pattern: '^[0-9]{8}$' }
        date: { type: string, pattern: '^[0-9]{8}$' }
        time: { type: string, pattern: '^[0-9]{6}$' }
        reference: { type: string, maxLength: 12 }
        type: { type: string, maxLength: 3 }
        description: { type: string, maxLength: 40 }
        amount: { type: number, format: double, multipleOf: 0.01 }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, nullable: true }
