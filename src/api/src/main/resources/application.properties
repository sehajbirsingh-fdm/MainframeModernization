spring.application.name=inqcust-api
app.lookup.random-retry-limit=1000

# Data mode switch: use 'mock' for JSON file data (default) or 'db' for relational DB.
app.data.mode=mock
app.mock-data.path=mock-data/customer-records.json
app.inqacc.mock-data.path=mock-data/account-records.json
app.inqacccu.mock-data.path=mock-data/account-relationship-records.json
app.inqacc.db.url=${APP_INQACC_DB_URL:}
app.inqacc.db.username=${APP_INQACC_DB_USERNAME:}
app.inqacc.db.password=${APP_INQACC_DB_PASSWORD:}
app.inqacc.db.driver-class-name=${APP_INQACC_DB_DRIVER:}
app.inqacc.db.maximum-pool-size=${APP_INQACC_DB_MAX_POOL_SIZE:10}
app.inqacc.db.minimum-idle=${APP_INQACC_DB_MIN_IDLE:2}
app.inqacc.db.schema=${APP_INQACC_DB_SCHEMA:}
app.inqacc.db.table-name=ACCOUNT

# CORS settings for frontend applications calling this API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# DB mode settings (used only when app.data.mode=db).
app.db.url=${APP_DB_URL:}
app.db.username=${APP_DB_USERNAME:}
app.db.password=${APP_DB_PASSWORD:}
app.db.table-name=CUSTOMER

# Connection pool settings for DB mode.
app.db.pool.max-size=10
app.db.pool.min-idle=2
app.db.pool.connection-timeout-ms=30000
app.db.pool.idle-timeout-ms=600000
app.db.pool.max-lifetime-ms=1800000

# Operational visibility for production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
