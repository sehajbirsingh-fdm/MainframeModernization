        relevance: 3
        must_contain: ["handleTechnicalFailure"]
    required_facts:
      - Validation failures return HTTP 400 with ERR-001.
      - Technical and unexpected failures return HTTP 500 with ERR-500.
      - The error response includes the current correlation ID.
    forbidden_claims: []
    reference_answer: TransactionInquiryExceptionHandler separates invalid input from infrastructure failure, returning ERR-001/400 or ERR-500/500 respectively and attaching the MDC correlation ID.
  metadata: {feature: inqtran, layer: error-handling, difficulty: medium}

- description: INQTRAN required detail columns
  vars:
