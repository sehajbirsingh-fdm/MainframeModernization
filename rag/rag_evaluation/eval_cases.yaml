      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqtran/service/TransactionInquiryService.java
        relevance: 3
        must_contain: ["TransactionDetailInquiryResponse(false, null)"]
    required_facts:
      - An empty repository result is not converted into a technical exception.
      - The response contains found false and a null transaction.
      - Repository failures are still wrapped as TransactionTechnicalException.
    forbidden_claims: ["A missing detail always returns HTTP 500."]
    reference_answer: inquireDetail maps an absent physical row to a normal response with found false and no transaction. Only repository exceptions become technical failures.
  metadata: {feature: inqtran, layer: service, difficulty: medium}

- description: INQTRAN duplicate detail protection
  vars:
    question: What happens if the transaction detail identity matches more than one physical database row?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqtran/repository/JdbcTransactionRepository.java
        relevance: 3
        must_contain: ["Duplicate physical matches detected"]
    required_facts:
      - The repository reads the first matching row and checks for another.
      - A second row is treated as a repository integrity failure.
      - The duplicate is not silently returned as one arbitrary transaction.
    forbidden_claims: []
    reference_answer: JdbcTransactionRepository enforces uniqueness for the composite detail identity. If a second physical row exists, it raises TransactionRepositoryException rather than selecting one silently.
  metadata: {feature: inqtran, layer: persistence, difficulty: hard}

- description: INQTRAN exception envelope mapping
