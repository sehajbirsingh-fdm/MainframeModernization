- description: CRECUST number allocation lock
  vars:
    question: How does customer creation avoid allocating the same customer number concurrently?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/crecust/service/CustomerCreateService.java
        relevance: 3
        must_contain: ["tryLock"]
    required_facts:
      - A ReentrantLock is maintained per configured sort code.
      - Failure to acquire it produces ERR-202.
      - Number allocation happens while holding the lock and it is released in finally.
    forbidden_claims: []
    reference_answer: The service keeps a ReentrantLock per sort code and uses tryLock before asking the repository for the next number. It reports ERR-202 when unavailable and releases the lock in a finally block after allocation and persistence work.
  metadata: {feature: crecust, layer: concurrency, difficulty: hard}

