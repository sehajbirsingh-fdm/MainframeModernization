        relevance: 2
        must_contain: ["exactly 6 numeric digits", "exactly 8 numeric digits"]
    required_facts:
      - Sort code must contain exactly six digits.
      - Account number must contain exactly eight digits.
      - Both frontend and backend enforce the formats.
    forbidden_claims: []
    reference_answer: Account inquiry accepts a six-digit numeric sort code and an eight-digit numeric account number. The React validator and backend AccountInquiryValidator enforce the same shapes.
  metadata: {feature: inqacc, layer: validation, difficulty: easy}

- description: INQACC bearer authentication
  vars:
    question: How is the account inquiry endpoint authenticated and authorized?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/security/BearerTokenAuthenticationFilter.java
        relevance: 3
        must_contain: ["ROLE_ACCOUNT_INQUIRER", "Bearer "]
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/config/InqaccSecurityConfiguration.java
        relevance: 3
        must_contain: ["hasRole", "ACCOUNT_INQUIRER"]
      - file_id: frontend/app/src/api/accountInquiryClient.ts
        relevance: 2
        must_contain: ["Authorization", "Bearer"]
    required_facts:
      - The frontend sends an Authorization Bearer header.
      - The filter maps the inquirer token to ROLE_ACCOUNT_INQUIRER.
      - GET /v1/accounts/** requires ACCOUNT_INQUIRER and sessions are stateless.
    forbidden_claims: ["Authentication uses browser session cookies."]
    reference_answer: The client sends a bearer token. A stateless Spring Security filter validates it and grants ROLE_ACCOUNT_INQUIRER for the accepted inquirer token; GET /v1/accounts/** requires that role.
  metadata: {feature: inqacc, layer: security, difficulty: medium}

