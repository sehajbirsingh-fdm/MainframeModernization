- description: INQCUST random lookup sentinel
  vars:
    question: What customer number requests a random customer and what happens next?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqcust/service/LookupModeResolver.java
        relevance: 3
