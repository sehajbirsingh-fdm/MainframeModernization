        relevance: 3
        must_contain: ["requestSequenceRef", "isDuplicatePending"]
    required_facts:
      - A duplicate in-flight request for the same input is ignored and the button is disabled.
      - A sequence number prevents an older response from replacing newer state.
    forbidden_claims: []
    reference_answer: The page tracks the active input key and disables or ignores another submission for that same key while loading. It also increments requestSequenceRef and discards a response whose sequence is no longer current.
  metadata: {feature: inqacc, layer: frontend, difficulty: medium}

