- description: INQACC button end-to-end workflow
  vars:
    question: What does the Inquire Account button do and how does the request reach the backend?
    answerable: true
    gold_sources:
      - file_id: frontend/app/src/features/accountInquiry/AccountInquiryPage.tsx
        relevance: 3
        must_contain: ["executeInquiry"]
      - file_id: frontend/app/src/api/accountInquiryClient.ts
        relevance: 3
        must_contain: ["/v1/accounts/"]
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/controller/AccountInquiryController.java
        relevance: 2
        must_contain: ["getAccount"]
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/service/AccountInquiryService.java
        relevance: 2
        must_contain: ["inquireAccount"]
    required_facts:
      - The form validates a six-digit sort code and eight-digit account number.
      - The client sends GET /v1/accounts/{sortcode}/{accountNumber} with a bearer token.
      - The page renders success, not-found, backend, timeout, and network outcomes.
    forbidden_claims: ["The button performs a POST request."]
    reference_answer: The form validates the two identifiers and calls inquireAccount, which sends an authenticated GET to /v1/accounts/{sortcode}/{accountNumber}. The controller delegates to AccountInquiryService and the page maps the result into loading, success, not-found, or error UI state.
  metadata: {feature: inqacc, layer: end-to-end, difficulty: hard}

- description: INQACC highest account sentinel
  vars:
    question: How do I retrieve the highest account number for a sort code?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/service/AccountInquiryService.java
        relevance: 3
        must_contain: ["99999999", "findHighestAccountNumberBySortcode"]
      - file_id: frontend/app/src/features/accountInquiry/AccountInquiryPage.tsx
        relevance: 2
        must_contain: ["99999999"]
    required_facts:
      - Account number 99999999 is the reserved highest-account sentinel.
      - The service calls findHighestAccountNumberBySortcode instead of a specific lookup.
    forbidden_claims: ["00000000 is the highest-account sentinel."]
    reference_answer: Supply the normal six-digit sort code and account number 99999999. AccountInquiryService recognizes that reserved value and asks the repository for the highest account number under that sort code.
  metadata: {feature: inqacc, layer: backend, difficulty: easy}

- description: INQACC input validation
