- description: INQSTMT repository null normalization
  vars:
    question: How does JdbcStatementRepository normalize null amounts and padded statement fields?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqstmt/repository/JdbcStatementRepository.java
        relevance: 3
        must_contain: ["defaultAmount"]
    required_facts:
      - Null monetary amounts become BigDecimal.ZERO.
      - Required strings become blank when null and are trailing-space trimmed.
      - Nullable descriptions preserve null before service-level normalization.
    forbidden_claims: []
    reference_answer: The JDBC mapper defaults missing amounts to zero and strips trailing fixed-width padding. It distinguishes nullable descriptions so AccountStatementService can later replace blank descriptions with N/A.
  metadata: {feature: inqstmt, layer: persistence, difficulty: medium}

- description: INQSTMT repository failure wrapping
  vars:
    question: How does AccountStatementService distinguish a missing account from a database failure?
