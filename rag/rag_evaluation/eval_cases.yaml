- description: INQACC repository lookup selection
  vars:
    question: Which database lookup is used for a normal account inquiry versus the reserved lookup?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/service/AccountInquiryService.java
        relevance: 3
        must_contain: ["findBySortcodeAndAccountNumber", "findHighestAccountNumberBySortcode"]
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/repository/JdbcAccountRepository.java
        relevance: 2
        must_contain: ["ACCOUNT_SORTCODE", "ACCOUNT_NUMBER"]
    required_facts:
      - Normal lookup uses both sort code and account number.
      - Reserved 99999999 lookup selects the highest account for the sort code.
      - Missing data produces AccountNotFoundException.
    forbidden_claims: []
    reference_answer: A normal request calls findBySortcodeAndAccountNumber. The 99999999 sentinel calls findHighestAccountNumberBySortcode, and either empty result is converted into AccountNotFoundException.
  metadata: {feature: inqacc, layer: persistence, difficulty: medium}

- description: INQACC stale response and duplicate request protection
