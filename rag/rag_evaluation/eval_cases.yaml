      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqcust/service/CustomerInquiryService.java
        relevance: 3
        must_contain: ["randomLookup", "randomRetryLimit"]
    required_facts:
      - 0000000000 selects RANDOM mode.
      - The service generates candidate customer numbers up to a configured retry limit.
      - Malformed or absent candidates are skipped before returning random-not-found.
    forbidden_claims: ["The UI sends a lookupMode query parameter.", "The React app has a Random button."]
    reference_answer: Customer number 0000000000 is the random sentinel. The service finds an upper bound, generates candidates, looks each one up, skips invalid records, and returns random-not-found if the retry limit is exhausted.
