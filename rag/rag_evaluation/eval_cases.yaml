- description: INQACCCU staged repository retrieval
  vars:
    question: In what stages does the customer-account repository retrieve relationship data?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacccu/repository/JdbcAccountRelationshipRepository.java
        relevance: 3
        must_contain: ["loadCustomer", "loadAccounts", "loadSimulationStage"]
    required_facts:
      - It obtains a connection and checks an optional simulation stage.
      - It loads the customer before loading accounts.
      - SQL errors become RepositoryUnavailableException.
    forbidden_claims: []
    reference_answer: The repository opens one connection, reads any configured simulation stage, loads the customer, then loads accounts ordered by account number. Stage failures are simulated around those reads, while SQL failures become RepositoryUnavailableException.
