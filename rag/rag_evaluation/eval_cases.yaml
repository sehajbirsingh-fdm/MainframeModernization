    question: How does account security distinguish an unauthenticated request from an authenticated but forbidden request?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/security/InqaccAuthenticationEntryPoint.java
        relevance: 3
        must_contain: ["SC_UNAUTHORIZED"]
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqacc/security/InqaccAccessDeniedHandler.java
        relevance: 3
        must_contain: ["SC_FORBIDDEN"]
    required_facts:
      - Missing or invalid authentication produces HTTP 401.
      - Insufficient authority produces HTTP 403.
      - Both handlers serialize structured JSON errors.
    forbidden_claims: []
    reference_answer: The authentication entry point writes a structured 401 response when credentials are absent or invalid. The access-denied handler writes a structured 403 response when an authenticated principal lacks the required role.
  metadata: {feature: inqacc, layer: security, difficulty: medium}

