        relevance: 3
        must_contain: ["Matched detail row contains null"]
    required_facts:
      - Null amount is treated as a repository failure for detail lookup.
      - Required identity and descriptive columns are checked by requireColumn.
      - Valid fixed-width strings are trailing-space trimmed.
    forbidden_claims: ["Null detail fields are always replaced with empty strings."]
    reference_answer: Detail mapping requires amount and the selected transaction columns to be non-null. A missing required value raises TransactionRepositoryException; valid strings are stripped of trailing padding.
