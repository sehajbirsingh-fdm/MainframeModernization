- description: INQCUST high risk rules
  vars:
    question: Which customer conditions produce a HIGH risk assessment?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqcust/service/RiskAssessmentService.java
        relevance: 3
        must_contain: ["STATUS_SUSPENDED", "CREDIT_SCORE_LT_600"]
    required_facts:
      - SUSPENDED status produces HIGH risk.
      - A non-null credit score below 600 produces HIGH risk.
      - A stale credit review is recorded separately as a reason and reviewRequired flag.
    forbidden_claims: []
    reference_answer: A suspended customer is HIGH risk, as is a customer with a credit score below 600. A missing or older-than-12-month review also sets reviewRequired and adds STALE_CREDIT_REVIEW.
  metadata: {feature: inqcust, layer: business-logic, difficulty: easy}

- description: INQCUST medium and low risk rules
  vars:
    question: When is customer risk LOW versus MEDIUM?
    answerable: true
    gold_sources:
      - file_id: backend/api/src/main/java/com/bankofz/mainframemodernization/inqcust/service/RiskAssessmentService.java
        relevance: 3
        must_contain: ["CREDIT_SCORE_600_TO_699", "ACTIVE_SCORE_GE_700_REVIEW_CURRENT"]
    required_facts:
      - Scores from 600 through 699 produce MEDIUM.
      - ACTIVE with score at least 700 and a current review produces LOW.
      - Other non-high cases fall back to MEDIUM.
    forbidden_claims: []
    reference_answer: A score from 600 to 699 is MEDIUM. LOW requires ACTIVE status, score at least 700, and a review that is not stale; remaining non-high combinations default to MEDIUM.
  metadata: {feature: inqcust, layer: business-logic, difficulty: medium}

