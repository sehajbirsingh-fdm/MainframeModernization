- description: INQTRAN frontend page-count calculation
  vars:
    question: How does TransactionInquiryPage calculate pages and move between result sets?
    answerable: true
    gold_sources:
      - file_id: frontend/app/src/features/transactionInquiry/TransactionInquiryPage.tsx
        relevance: 3
        must_contain: ["Math.ceil(result.totalCount / result.limit)"]
    required_facts:
      - Total pages are derived from totalCount and effective limit.
      - Next adds limit to offset and previous subtracts it without going below zero.
      - Changing page resubmits the current filters with the new offset.
    forbidden_claims: []
    reference_answer: The page computes total pages from the backend count and page size. Navigation adjusts offset by one limit-sized window, clamps backward movement at zero, and reruns the existing query.
